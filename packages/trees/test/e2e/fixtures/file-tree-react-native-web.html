<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React Native Web FileTree</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }

      body {
        background: #eef3f7;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      .shell {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 12px;
        height: 320px;
        padding: 16px;
        width: 460px;
      }

      .panel {
        border: 1px solid #d4dde8;
        border-radius: 8px;
        display: flex;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }

      .summary {
        color: #64748b;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React from 'react';
      import { createRoot } from 'react-dom/client';
      import { FileTree, useFileTree } from '/dist/react-native/index.js';

      const paths = [
        'apps/',
        'apps/mobile/',
        'apps/mobile/App.tsx',
        'apps/mobile/src/',
        'apps/mobile/src/screens/',
        'apps/mobile/src/screens/HomeScreen.tsx',
        'apps/mobile/src/screens/FilesScreen.tsx',
        'packages/',
        'packages/trees/',
        'packages/trees/src/',
        'packages/trees/src/react-native/',
        'packages/trees/src/react-native/FileTree.tsx',
        'packages/trees/src/react-native/NativeFileTree.ts',
        'README.md',
      ];

      const selectedPath = 'packages/trees/src/react-native/FileTree.tsx';

      function App() {
        const { model } = useFileTree({
          density: 'compact',
          flattenEmptyDirectories: true,
          initialExpandedPaths: [
            'apps/',
            'apps/mobile/',
            'apps/mobile/src/',
            'apps/mobile/src/screens/',
            'packages/',
            'packages/trees/',
            'packages/trees/src/',
            'packages/trees/src/react-native/',
          ],
          initialSelectedPaths: [selectedPath],
          paths,
          search: false,
        });

        React.useEffect(() => {
          window.__fileTreeReactNativeWebSnapshot = {
            selectedPaths: model.getSelectedPaths(),
            visibleCount: model.getVisibleCount(),
            visiblePaths: model
              .getVisibleRows(0, model.getVisibleCount() - 1)
              .map((row) => row.targetPath),
          };
          window.__fileTreeReactNativeWebReady = true;
        }, [model]);

        return React.createElement(
          'main',
          { className: 'shell' },
          React.createElement(
            'div',
            { className: 'summary' },
            'React Native Web FileTree constrained flex fixture'
          ),
          React.createElement(
            'div',
            { className: 'panel' },
            React.createElement(FileTree, {
              contentContainerStyle: { padding: 8 },
              model,
              style: { flex: 1 },
              testID: 'rn-web-tree',
            })
          )
        );
      }

      createRoot(document.getElementById('root')).render(
        React.createElement(App)
      );
    </script>
  </body>
</html>
